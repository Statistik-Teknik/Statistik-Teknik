name: GitHub Classroom Autograding

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  checks: write
  actions: read
  contents: read

jobs:
  run-autograding-tests:
    name: Autograding R Tests
    runs-on: ubuntu-latest
    if: "!contains(github.actor, 'classroom')"
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup R Environment
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: 'release'

      - name: Install Dependencies
        run: |
          Rscript -e 'if (!require("testthat", quietly = TRUE)) install.packages("testthat", repos = "https://cloud.r-project.org")'

      - name: Test Soal 1 - Statistik Deskriptif
        id: test-soal-1
        uses: classroom-resources/autograding-command-grader@v1
        with:
          test-name: Test Soal 1 - Statistik Deskriptif
          setup-command: ''
          command: Rscript -e 'testthat::test_file("tests/test_soal1.R")'
          timeout: 5
          max-score: 25

      - name: Test Soal 2 - Uji Hipotesis t-Test
        id: test-soal-2
        uses: classroom-resources/autograding-command-grader@v1
        with:
          test-name: Test Soal 2 - Uji Hipotesis t-Test
          setup-command: ''
          command: Rscript -e 'testthat::test_file("tests/test_soal2.R")'
          timeout: 5
          max-score: 25

      - name: Test Soal 3 - Korelasi dan Regresi Linier
        id: test-soal-3
        uses: classroom-resources/autograding-command-grader@v1
        with:
          test-name: Test Soal 3 - Korelasi dan Regresi Linier
          setup-command: ''
          command: Rscript -e 'testthat::test_file("tests/test_soal3.R")'
          timeout: 5
          max-score: 25

      - name: Test Soal 4 - Analisis Kapabilitas Proses
        id: test-soal-4
        uses: classroom-resources/autograding-command-grader@v1
        with:
          test-name: Test Soal 4 - Analisis Kapabilitas Proses
          setup-command: ''
          command: Rscript -e 'testthat::test_file("tests/test_soal4.R")'
          timeout: 5
          max-score: 25

      - name: Autograding Grading Reporter
        uses: classroom-resources/autograding-grading-reporter@v1
        env:
          TEST-SOAL-1_RESULTS: "${{steps.test-soal-1.outputs.result}}"
          TEST-SOAL-2_RESULTS: "${{steps.test-soal-2.outputs.result}}"
          TEST-SOAL-3_RESULTS: "${{steps.test-soal-3.outputs.result}}"
          TEST-SOAL-4_RESULTS: "${{steps.test-soal-4.outputs.result}}"
        with:
          runners: test-soal-1,test-soal-2,test-soal-3,test-soal-4
